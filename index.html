<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hokkaido Winter Escape 2026</title>
<style>
    /* Base Styles & Typography */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; color: #1f2937; line-height: 1.6; transition: background 0.3s ease; }
    a { text-decoration: none; color: inherit; }

    /* Header & Hero Image */
    .hero { position: relative; width: 100%; height: 50vh; background-color: #e5e7eb; }
    .hero-img { width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 40px; color: white; text-align: center; }
    
    .lang-select { position: absolute; top: 20px; right: 20px; z-index: 10; }
    .lang-select select { padding: 8px 16px; border-radius: 8px; border: none; background: rgba(255,255,255,0.9); font-size: 0.95rem; font-weight: 600; outline: none; cursor: pointer; backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    .hero-overlay h1 { font-size: 3rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; font-family: "Georgia", serif; transition: opacity 0.3s ease; }
    .hero-overlay p { font-size: 1rem; font-weight: 500; text-transform: uppercase; letter-spacing: 3px; color: #f3f4f6; transition: opacity 0.3s ease; }

    /* Timeline Container */
    .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
    
    /* Timeline Item Layout */
    .timeline-item { display: flex; margin-bottom: 60px; position: relative; opacity: 1; transition: opacity 0.4s ease; }
    
    /* Left Column: Date */
    .timeline-left { width: 140px; flex-shrink: 0; position: relative; padding-right: 30px; text-align: left; }
    .timeline-date { font-weight: 700; font-size: 1.15rem; color: #111827; position: sticky; top: 30px; line-height: 1.3; transition: color 0.3s ease; }
    .timeline-line { position: absolute; right: 0; top: 12px; bottom: -72px; width: 2px; background-color: #e5e7eb; }
    .timeline-dot { position: absolute; right: -5px; top: 12px; width: 12px; height: 12px; background-color: #fff; border: 2px solid #1f2937; border-radius: 50%; z-index: 2; transition: all 0.3s ease; }

    /* Active Highlight States */
    .timeline-item.active .timeline-dot { background-color: #3b82f6; border-color: #3b82f6; box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.2); transform: scale(1.1); }
    .timeline-item.active .timeline-date { color: #3b82f6; }
    .timeline-item.active .card { border: 2px solid #3b82f6; box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.25); }
    
    .today-badge { display: inline-block; background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; letter-spacing: 1px; margin-top: 8px; font-weight: 700; }

    /* Right Column: Card (Blog Style) */
    .timeline-right { flex-grow: 1; padding-left: 40px; width: 100%; min-width: 0; }
    .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #f3f4f6; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    .card:hover { transform: translateY(-3px); }
    
    /* Card Header */
    .card-header { height: 280px; background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; padding: 30px; background-color: #d1d5db; }
    .card-header::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 70%); }
    .card-title { position: relative; z-index: 1; color: #fff; font-size: 1.8rem; font-weight: 700; font-family: "Georgia", serif; letter-spacing: 0.5px; }

    /* Card Content */
    .card-body { padding: 35px 30px; }
    .card-desc { font-size: 1.05rem; color: #4b5563; margin-bottom: 25px; line-height: 1.7; }

    .section-label { font-size: 0.75rem; color: #9ca3af; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; margin-top: 25px; display: flex; align-items: center; }
    .section-label::before { content: '—'; margin-right: 8px; }

    /* Accommodation & Booking UI */
    .acc-wrapper { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
    
    .acc-box { display: flex; align-items: center; padding: 16px 20px; background: #fff; transition: background 0.2s ease; cursor: pointer; text-decoration: none; }
    .acc-box:hover { background: #f9fafb; }
    .acc-icon { width: 36px; height: 36px; background: #f3f4f6; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0; }
    .acc-icon svg { width: 18px; height: 18px; fill: none; stroke: #4b5563; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .acc-name { font-size: 1rem; font-weight: 600; color: #1f2937; }

    /* Native Details/Summary for Bookings */
    details.booking-details { background: #f9fafb; border-top: 1px solid #e5e7eb; }
    details.booking-details summary { padding: 12px 20px; font-size: 0.85rem; font-weight: 600; color: #3b82f6; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    details.booking-details summary::-webkit-details-marker { display: none; }
    details.booking-details summary::after { content: '+ View Booking Details'; }
    details.booking-details[open] summary::after { content: '- Hide Details'; color: #6b7280; }
    
    .booking-content { padding: 0 20px 20px 20px; font-size: 0.85rem; color: #4b5563; }
    .booking-item { margin-bottom: 6px; display: flex; flex-direction: column; }
    .booking-label { font-weight: 600; color: #111827; margin-bottom: 2px; }
    .booking-tag { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; margin-top: 4px; }
    
    .pwd-protected { cursor: pointer; color: #2563eb; font-weight: 600; text-decoration: underline dotted; }
    .pwd-protected:hover { color: #1d4ed8; }

    /* Activities List */
    .activity-list { list-style: none; display: flex; flex-direction: column; gap: 16px; margin-top: 15px; }
    .activity-item { display: flex; align-items: flex-start; }
    .activity-icon { margin-right: 14px; margin-top: 3px; flex-shrink: 0; }
    .activity-icon svg { width: 18px; height: 18px; fill: none; stroke: #ef4444; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .activity-link { font-size: 1rem; font-weight: 500; color: #374151; transition: color 0.2s; border-bottom: 1px dotted transparent; }
    .activity-link:hover { color: #ef4444; border-bottom: 1px dotted #ef4444; }

    @media (max-width: 768px) {
        .timeline-item { flex-direction: column; margin-bottom: 40px; }
        .timeline-left { width: 100%; margin-bottom: 20px; padding-right: 0; display: flex; align-items: center; gap: 15px; }
        .timeline-date { position: static; }
        .timeline-line { display: none; }
        .timeline-dot { display: none; }
        .timeline-right { padding-left: 0; }
        .hero-overlay h1 { font-size: 2.2rem; }
    }
</style>

    const pwd = prompt("Enter Family Password to reveal booking details:");
    if (pwd === PAGE_PASSWORD) {
        isUnlocked = true;
        document.querySelectorAll('.pwd-protected').forEach(el => {
            el.innerHTML = el.getAttribute('data-secret');
        });
        return true;
    } else if (pwd !== null) {
        alert("Incorrect Password.");
    }
    return false;
}

    const dayOfMonth = String(today.getDate()).padStart(2, '0');
    const todayFormatted = `${year}-${month}-${dayOfMonth}`;

    let activeIndex = 0; 
    for (let i = 0; i < itinerary.length; i++) {
        if (itinerary[i].dateStr === todayFormatted) {
            activeIndex = i;
            break;
        }
    }

    function renderTimeline(lang) {
        heroTitle.textContent = staticText.heroTitle[lang];
        heroSubtitle.textContent = staticText.heroSubtitle[lang];

        let finalHTML = "";

        itinerary.forEach((day, index) => {
            let actsHtml = "";
            day.acts.forEach(act => {
                actsHtml += `
                    <li class="activity-item">
                        <div class="activity-icon">${pinIcon}</div>
                        <a class="activity-link" href="${getMapUrl(act[lang])}" target="_blank">${act[lang]}</a>
                    </li>`;
            });

            let bookingHtml = "";
            if (day.booking && day.booking.length > 0) {
                let bookingItems = day.booking.map(b => {
                    let secretVal = b.value;
                    let maskedVal = secretVal.replace(/[A-Z0-9]{4,}/g, '****');
                    return `
                        <div class="booking-item">
                            <span class="booking-label">${b.label[lang]}</span>
                            <span class="booking-tag">
                                ${isUnlocked ? secretVal : `<span class="pwd-protected" data-secret="${secretVal}" onclick="unlockDetails()">🔒 Click to Reveal (${maskedVal})</span>`}
                            </span>
                        </div>
                    `;
                }).join('');
                
                bookingHtml = `
                    <details class="booking-details">
                        <summary></summary>
                        <div class="booking-content">
                            ${bookingItems}
                        </div>
                    </details>
                `;
            }

            const safeImgUrl = encodeURI(day.img);
            const isActive = index === activeIndex;
            const activeClass = isActive ? 'active' : '';
            const badgeHtml = isActive ? `<div class="today-badge">${staticText.todayBadge[lang]}</div>` : '';

            const html = `
                <div class="timeline-item ${activeClass}" id="day-${index}">
                    <div class="timeline-left">
                        <div class="timeline-date">${day.date[lang]}<br>${badgeHtml}</div>
                        <div class="timeline-line"></div>
                        <div class="timeline-dot"></div>
                    </div>
                    <div class="timeline-right">
                        <div class="card">
                            <div class="card-header" style="background-image: url('${safeImgUrl}');">
                                <h2 class="card-title">${day.title[lang]}</h2>
                            </div>
                            <div class="card-body">
                                <p class="card-desc">${day.desc[lang]}</p>
                                
                                <div class="section-label">${staticText.accLabel[lang]}</div>
                                <div class="acc-wrapper">
                                    <a class="acc-box" href="${getMapUrl(day.stay[lang])}" target="_blank">
                                        <div class="acc-icon">${houseIcon}</div>
                                        <div class="acc-name">${day.stay[lang]}</div>
                                    </a>
                                    ${bookingHtml}
                                </div>
                                
                                <div class="section-label">${staticText.actLabel[lang]}</div>
                                <ul class="activity-list">${actsHtml}</ul>
                            </div>
                        </div>
                    </div>
                </div>`;
            finalHTML += html;
        });

        timelineEl.style.opacity = 0;
        setTimeout(() => {
            timelineEl.innerHTML = finalHTML;
            timelineEl.style.opacity = 1;
        }, 150);
    }

    renderTimeline('en');

    langSelector.addEventListener('change', function(e) {
        renderTimeline(e.target.value);
    });

    setTimeout(() => {
        const activeEl = document.querySelector('.timeline-item.active');
        if (activeEl && activeIndex !== 0) {
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }, 500);
});
